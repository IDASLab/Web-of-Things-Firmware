; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:d1]
platform = espressif8266@4.2.1
framework = arduino
board = d1
board_build.filesystem = littlefs
; 4 MB flash: ~2 MB app area (room for OTA), 2 MB LittleFS for files and logs
board_build.ldscript = eagle.flash.4m2m.ld
monitor_speed = 115200
build_flags =
	-DASYNCWEBSERVER_REGEX=0
	; -DWOT_ENABLE_CORS   ; only while developing the front end on another origin
; Versions verified to build together (ESP8266 Arduino core 3.1.2)
lib_deps =
	esp32async/ESPAsyncTCP@^2.0.0
	esp32async/ESPAsyncWebServer@^3.12.1
	adafruit/DHT sensor library@^1.4.7
	adafruit/Adafruit Unified Sensor@^1.1.15
	bblanchon/ArduinoJson@^7.4.3
	marvinroger/AsyncMqttClient@^0.9.0
; Old/unmaintained forks that would clash with the libraries above
lib_ignore =
	ESPAsyncTCP-esphome
	ESP Async WebServer
